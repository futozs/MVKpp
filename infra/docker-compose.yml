# MVK v3  éles telepítés egy VPS-en.
#   cp infra/.env.example infra/.env && (töltsd ki)
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
name: mvk

services:
  db:
    image: timescale/timescaledb-ha:pg17.11-ts2.31.0  # rögzítve: a mentés-visszaállítás azonos verziót kér
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mvk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kell}
      POSTGRES_DB: ${POSTGRES_DB:-mvk}
      TIMESCALEDB_TELEMETRY: "off"
    command: >
      postgres -c shared_buffers=${PG_SHARED_BUFFERS:-512MB} -c effective_cache_size=${PG_CACHE:-1536MB}
               -c max_connections=60 -c timescaledb.max_background_workers=8 -c wal_compression=on
    volumes:
      - db:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mvk} -d ${POSTGRES_DB:-mvk}"]
      interval: 5s
      timeout: 3s
      retries: 30
    # A port szándékosan NINCS kinyitva; mentéshez: docker compose exec db pg_dump …

  worker:
    build: { context: .., dockerfile: infra/Dockerfile, target: worker }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    # Csak a gépen belülről: ha a token-agent ugyanezen a gépen fut, ide küld
    # (http://127.0.0.1:8090). Kívülről minden a Caddyn át megy.
    ports: ["127.0.0.1:8090:8090"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mvk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mvk}
      APP_SECRET: ${APP_SECRET:?APP_SECRET kell}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY kell}
      AGENT_SECRET: ${AGENT_SECRET:?AGENT_SECRET kell}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      REDIS_URL: ${REDIS_URL:-}
      # MÁV+ (OTP2): Volán, vasút és az MVK tartaléka  docs/MAVPLUSZ_OTP2.md, M. fejezet
      OTP2_ENABLED: ${OTP2_ENABLED:-1}
      REGIONAL: ${REGIONAL:-1}
      DB_POOL: "12"
    stop_grace_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        WORKER_URL: http://worker:8090
    restart: unless-stopped
    depends_on: [worker]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mvk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mvk}
      WORKER_URL: http://worker:8090
      APP_SECRET: ${APP_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # a /push/apns csak azt nézi, be van-e állítva (a küldés a workeré)
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      # A passkey ehhez a domainhez kötődik  ugyanaz legyen, mint a régi rendszeré.
      RP_ORIGINS: https://${DOMAIN:?DOMAIN kell}
      REDIS_URL: ${REDIS_URL:-}
      DB_POOL: "8"
      # a rendszer-hub ezzel olvassa a web válaszidőit (/v3/admin/metrics)  NEM a mesterkulcs
      METRICS_KEY: ${METRICS_KEY:-}

  # Rendszer-hub: üzemeltetői pult, CSAK a belső hálón (HUB_BIND = a szerver LAN-címe,
  # pl. 192.168.1.11). Soha ne kösd 0.0.0.0-ra egy nyilvános VPS-en!
  #   http://<HUB_BIND>:<HUB_PORT>   belépés a HUB_PASSWORD-del
  hub:
    build: { context: .., dockerfile: infra/Dockerfile, target: hub }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy }, worker: { condition: service_started } }
    ports: ["${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8099}:3000"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mvk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mvk}
      WORKER_URL: http://worker:8090
      WEB_URL: http://web:3000
      DOMAIN: ${DOMAIN}
      ADMIN_KEY: ${ADMIN_KEY}
      METRICS_KEY: ${METRICS_KEY:-}
      HUB_PASSWORD: ${HUB_PASSWORD:-}
      HUB_ALLOWED_CIDRS: ${HUB_ALLOWED_CIDRS:-}
      HUB_ALLOWED_HOSTS: ${HUB_ALLOWED_HOSTS:-}
      HUB_GIT_TOKEN: ${HUB_GIT_TOKEN:-}
      HUB_BACKUP_HOUR: ${HUB_BACKUP_HOUR:-4}
      HUB_BACKUP_KEEP: ${HUB_BACKUP_KEEP:-7}
      COMPOSE_PROJECT: mvk
      DB_POOL: "4"
      APP_NAME: mvk-hub
    volumes:
      # a Docker vezérlése (konténerek, naplók, újratelepítés)  root-egyenértékű jog, ezért csak belső hálón!
      - /var/run/docker.sock:/var/run/docker.sock
      # a repó: git-állapot és frissítés (a telepítő segédkonténer a gépen lévő útvonalon csatolja)
      - ..:/repo
      # adatbázis-mentések a gépen: data/backups
      - ../data/backups:/backups

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [web, worker]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  caddy-data:
  caddy-config:
